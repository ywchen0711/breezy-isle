<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Breezy Isle 微風島</title>
<meta name="description" content="An online island life game: farm, fish, catch bugs, build and decorate a home, craft gear, give gifts to friends and team up against bosses.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='8' fill='%235ab8f0'/%3E%3Cellipse cx='8' cy='11' rx='6' ry='3' fill='%23f2e2a8'/%3E%3Cpath d='M8 11V4' stroke='%238a5a34' stroke-width='1.2'/%3E%3Cpath d='M8 4c-3 0-4 2-4 2 1.5-.5 3-.6 4 0 1-.6 2.5-.5 4 0 0 0-1-2-4-2z' fill='%234aa83a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="cv"></canvas>
<div id="flash"></div>

<div id="tags"></div>
<div id="hud" hidden>
  <div id="meBox">
    <div class="nm"><b id="meName"></b> <span id="meLv"></span></div>
    <div class="bar hp"><i id="hpBar"></i><span id="hpTxt"></span></div>
    <div class="bar xp"><i id="expBar"></i></div>
    <div class="row"><span id="coins"></span><span id="netSt"></span></div>
  </div>
  <div id="clock"></div>
  <div id="bossbar" hidden><b id="bossName"></b><div class="bar"><i id="bossHp"></i></div></div>
  <div id="tools">
    <button id="bBag" title="Bag">🎒</button><button id="bChar" title="Character">👕</button><button id="bHome" title="Home">🏠</button>
    <button id="bDex" title="Encyclopedia">📖</button><button id="bSocial" title="Friends">👥</button><button id="bDaily" title="Daily">📋</button><button id="bSet" title="Settings">⚙️</button>
  </div>
  <canvas id="mini" width="150" height="150"></canvas>
  <div id="party" hidden></div>
  <div id="hint" hidden></div>
  <div id="hotbar"></div>
  <div id="msg"></div>
  <div id="banner"></div>
  <div id="pops"></div>
  <div id="catch"></div>
  <div id="toasts"></div>
  <div id="stick"><div id="knob"></div></div>
  <div id="touchBtns"><button id="bEat" hidden>🍲</button><button id="bRoll" hidden>💨</button><button id="bAtk" hidden>⚔️</button><button id="bAct">✋</button></div>
</div>

<div id="win" class="screen" hidden>
  <div class="card wincard"><div class="winhead"><h2 id="winTitle"></h2><button id="winClose" class="x">✕</button></div><div id="winBody"></div></div>
</div>

<div id="title" class="screen">
  <div class="card titlec">
    <button id="tLang" class="ghost langb"></button>
    <h1 id="tTitle"></h1>
    <p id="tSub" class="sub"></p>
    <div class="cols">
      <div class="left">
        <canvas id="tPrev"></canvas>
        <label class="namel"><span id="tNameL"></span><input id="tName" maxlength="12" autocomplete="off" spellcheck="false"></label>
        <small id="tNameTip" class="tip"></small>
      </div>
      <div class="right">
        <h3 id="tLook"></h3>
        <div id="tLooks"></div>
        <h3 id="tWith"></h3>
        <div id="tRooms" class="rooms"></div>
        <div id="tPriv" class="priv" hidden><b id="tCodeNow" class="code"></b><button id="tNew" class="ghost"></button><input id="tCode" maxlength="4" autocomplete="off" spellcheck="false"><button id="tJoin" class="ghost"></button></div>
        <p id="tRoomTip" class="tip"></p>
        <button id="tPlay" class="big"></button>
        <p id="tKeys" class="tip"></p>
      </div>
    </div>
  </div>
</div>

<script type="module" src="js/main.js?v=3"></script>
<script src="/hub.js" data-pos="top-left" defer></script>
</body>
</html>
